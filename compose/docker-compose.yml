name: devops-stack

services:
  # ============================================================================
  # Uptime Kuma: Lekki monitoring blackbox (HTTP/S, Ping, DNS, Port, SSL)
  # ============================================================================
  uptime-kuma:
    image: louislam/uptime-kuma:1.23.13
    container_name: uptime-kuma
    labels:
      dev.dozzle.name: "uptime-kuma • Monitoring Stron WWW"
      org.opencontainers.image.description: "Monitoring dostępności stron WWW, API i certyfikatów SSL (Uptime Kuma)"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - internal_network
    ports:
      # Bezpieczeństwo: Powiązanie wyłącznie z pętlą zwrotną (localhost)
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    environment:
      - UPTIME_KUMA_PORT=3001
      - TZ=${TZ:-Europe/Warsaw}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "node extra/healthcheck.js || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================================================
  # Prometheus: Zbieranie metryk i silnik TSDB (Zero-Bloat)
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    labels:
      dev.dozzle.name: "prometheus • Baza Metryk TSDB"
      org.opencontainers.image.description: "Silnik bazy szeregów czasowych zbierający metryki serwera i usług (Prometheus)"
    restart: unless-stopped
    user: "65534:65534" # nobody:nobody (PoLP - non-root)
    security_opt:
      - no-new-privileges:true
    networks:
      - internal_network
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../config/prometheus/rules:/etc/prometheus/rules:ro
      - ../config/prometheus/kuma_password:/etc/prometheus/kuma_password:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=14d"
      - "--storage.tsdb.retention.size=512MB"
      - "--web.enable-lifecycle"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ============================================================================
  # Grafana: Wizualizacja metryk i dashboardy operacyjne
  # ============================================================================
  grafana:
    image: grafana/grafana:10.4.1
    container_name: grafana
    labels:
      dev.dozzle.name: "grafana • Dashboardy i Wykresy"
      org.opencontainers.image.description: "Wizualizacja metryk, statusów stron WWW, AI Routera i backupów (Grafana)"
    restart: unless-stopped
    user: "472:472" # grafana non-root
    security_opt:
      - no-new-privileges:true
    networks:
      - internal_network
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ../config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_AUTH_ANONYMOUS_ORG_ROLE=${GF_AUTH_ANONYMOUS_ORG_ROLE:-Viewer}
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/definitions/uptime-kuma-overview.json
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_LOG_MODE=console
      - GF_LOG_LEVEL=warn
      - TZ=${TZ:-Europe/Warsaw}
    depends_on:
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ============================================================================
  # Node Exporter: Zbieranie metryk sprzętowych i systemowych hosta
  # ============================================================================
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: node-exporter
    labels:
      dev.dozzle.name: "node-exporter • Parametry Hosta VPS"
      org.opencontainers.image.description: "Eksporter parametrów sprzętowych VPS (CPU, RAM, dysk) i telemetrii backupów"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - internal_network
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - ../config/node-exporter:/etc/node-exporter:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|run)($$|/)"
      - "--collector.textfile.directory=/etc/node-exporter"
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # cAdvisor: Monitorowanie zasobów kontenerów Dockera (CPU, RAM, Sieć)
  # ============================================================================
  cadvisor:
    image: ghcr.io/google/cadvisor:latest
    container_name: cadvisor
    labels:
      dev.dozzle.name: "cadvisor • Zasoby Kontenerów"
      org.opencontainers.image.description: "Monitorowanie zużycia procesora, pamięci RAM i sieci przez kontenery Docker"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - internal_network
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /etc/machine-id:/etc/machine-id:ro
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=15s"
      - "--disable_metrics=disk,diskIO,tcp,udp,percpu,sched,process,referenced_memory"
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 128M
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD", "/usr/bin/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # Dozzle: Ultralekki podgląd logów kontenerów w czasie rzeczywistym
  # ============================================================================
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    labels:
      dev.dozzle.name: "dozzle • Logi Kontenerów"
      org.opencontainers.image.description: "Przeglądarka logów wszystkich kontenerów Docker w czasie rzeczywistym"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - internal_network
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOZZLE_NO_ANALYTICS=true
      - DOZZLE_LEVEL=info
      - TZ=${TZ:-Europe/Warsaw}
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # GitHub Exporter: Telemetria zadań GitHub Actions & repozytoriów dla Prometheusa
  # ============================================================================
  github-exporter:
    image: promhippie/github-exporter:latest
    container_name: github-exporter
    labels:
      dev.dozzle.name: "github-exporter • Metryki GitHub"
      org.opencontainers.image.description: "Eksporter statystyk repozytoriów i statusów potoków GitHub Actions do Prometheusa"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - internal_network
    environment:
      - GITHUB_EXPORTER_TOKEN=${GITHUB_TOKEN}
      - GITHUB_EXPORTER_ORGS=TwojaStronaWWW,zeslownikiem
      - GITHUB_EXPORTER_REPOS=TwojaStronaWWW/devops-stack,TwojaStronaWWW/twojastronawww,TwojaStronaWWW/katosalsahub,TwojaStronaWWW/raricart,TwojaStronaWWW/hd-osticket-helpdesk,zeslownikiem/gal-anonym,zeslownikiem/gal-anonim-web
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD", "/usr/bin/github_exporter", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # AI Router: Scentralizowana bramka AI (PHP 8.3 Alpine, RAG per strona, Zero-Bloat)
  # ============================================================================
  ai-router:
    build:
      context: ../services/ai-router
      dockerfile: Dockerfile
    image: twojastronawww/ai-router:1.0.0
    container_name: ai-router
    labels:
      dev.dozzle.name: "ai-router • Czatbot AI & AMMS"
      org.opencontainers.image.description: "Scentralizowana bramka AI (11 modeli + Asystent AMMS & Oracle FTS5) dla TwojaStronaWWW"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - internal_network
    ports:
      # Bezpieczeństwo: Powiązanie wyłącznie z pętlą zwrotną (localhost)
      - "127.0.0.1:8085:8080"
    volumes:
      - ../services/ai-router/data:/app/data:ro
      - ai_router_storage:/app/storage
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY:-}
      - CEREBRAS_MODEL=${CEREBRAS_MODEL:-gpt-oss-120b}
      - CF_AI_API_TOKEN=${CF_AI_API_TOKEN:-}
      - CF_ACCOUNT_ID=${CF_ACCOUNT_ID:-}
      - CF_AI_MODEL=${CF_AI_MODEL:-@cf/meta/llama-3.3-70b-instruct-fp8-fast}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-haiku-4-5}
      - MODEL_DAILY_LIMITS=${MODEL_DAILY_LIMITS:-}
      - AI_CACHE_TTL=${AI_CACHE_TTL:-86400}
      - NTFY_TOPIC=${NTFY_TOPIC:-}
      - LEAD_WEBHOOK_URL=${LEAD_WEBHOOK_URL:-}
      - PHP_CLI_SERVER_WORKERS=4
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://katosalsahub.pl,https://www.katosalsahub.pl,https://fuegolingua.pl,https://www.fuegolingua.pl,https://twojastronawww.pl,https://www.twojastronawww.pl,https://raricart.pl,https://www.raricart.pl}
      - TZ=${TZ:-Europe/Warsaw}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# ==============================================================================
# Sieć izolowana
# ==============================================================================
networks:
  internal_network:
    name: devops_internal_network
    driver: bridge

# ==============================================================================
# Trwałe wolumeny danych (Data Persistence)
# ==============================================================================
volumes:
  uptime_kuma_data:
    name: uptime_kuma_data
  prometheus_data:
    name: prometheus_data
  grafana_data:
    name: grafana_data
  ai_router_storage:
    name: ai_router_storage
