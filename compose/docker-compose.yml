name: devops-stack

services:
  # ============================================================================
  # Uptime Kuma: Lekki monitoring blackbox (HTTP/S, Ping, DNS, Port, SSL)
  # ============================================================================
  uptime-kuma:
    image: louislam/uptime-kuma:1.23.13
    container_name: uptime-kuma
    labels:
      dev.dozzle.name: "uptime-kuma • Monitoring Stron WWW"
      org.opencontainers.image.description: "Monitoring dostępności stron WWW, API i certyfikatów SSL (Uptime Kuma)"
    restart: unless-stopped
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal_network
    ports:
      # Bezpieczeństwo: Powiązanie wyłącznie z pętlą zwrotną (localhost)
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    environment:
      - UPTIME_KUMA_PORT=3001
      - TZ=${TZ:-Europe/Warsaw}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 256
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "node extra/healthcheck.js || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================================================
  # Prometheus: Zbieranie metryk i silnik TSDB (Zero-Bloat)
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    labels:
      dev.dozzle.name: "prometheus • Baza Metryk TSDB"
      org.opencontainers.image.description: "Silnik bazy szeregów czasowych zbierający metryki serwera i usług (Prometheus)"
    restart: unless-stopped
    user: "65534:65534" # nobody:nobody (PoLP - non-root)
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal_network
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../config/prometheus/rules:/etc/prometheus/rules:ro
      - ../config/prometheus/kuma_password:/etc/prometheus/kuma_password:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=365d"
      - "--storage.tsdb.retention.size=2GB"
      - "--web.enable-lifecycle"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
          pids: 256
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ============================================================================
  # Grafana: Wizualizacja metryk i dashboardy operacyjne
  # ============================================================================
  grafana:
    image: grafana/grafana:10.4.1
    container_name: grafana
    labels:
      dev.dozzle.name: "grafana • Dashboardy i Wykresy"
      org.opencontainers.image.description: "Wizualizacja metryk, statusów stron WWW, AI Routera i backupów (Grafana)"
    restart: unless-stopped
    user: "472:472" # grafana non-root
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal_network
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ../config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_AUTH_ANONYMOUS_ORG_ROLE=${GF_AUTH_ANONYMOUS_ORG_ROLE:-Viewer}
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/definitions/uptime-kuma-overview.json
      - GF_PATHS_BUNDLED_PLUGINS=/var/lib/grafana/plugins
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_LOG_MODE=console
      - GF_LOG_LEVEL=warn
      - TZ=${TZ:-Europe/Warsaw}
    depends_on:
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 256
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ============================================================================
  # Node Exporter: Zbieranie metryk sprzętowych i systemowych hosta
  # ============================================================================
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: node-exporter
    labels:
      dev.dozzle.name: "node-exporter • Parametry Hosta VPS"
      org.opencontainers.image.description: "Eksporter parametrów sprzętowych VPS (CPU, RAM, dysk) i telemetrii backupów"
    restart: unless-stopped
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal_network
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - ../config/node-exporter:/etc/node-exporter:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|run)($$|/)"
      - "--collector.textfile.directory=/etc/node-exporter"
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
          pids: 64
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # cAdvisor: Monitorowanie zasobów kontenerów Dockera (CPU, RAM, Sieć)
  # ============================================================================
  cadvisor:
    image: ghcr.io/google/cadvisor:latest
    container_name: cadvisor
    labels:
      dev.dozzle.name: "cadvisor • Zasoby Kontenerów"
      org.opencontainers.image.description: "Monitorowanie zużycia procesora, pamięci RAM i sieci przez kontenery Docker"
    restart: unless-stopped
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal_network
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /etc/machine-id:/etc/machine-id:ro
    cap_drop:
      - ALL
    cap_add:
      - SYS_PTRACE
      - DAC_READ_SEARCH
      - SYSLOG
    devices:
      - /dev/kmsg:/dev/kmsg:r
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=15s"
      - "--disable_metrics=disk,diskIO,tcp,udp,percpu,sched,process,referenced_memory"
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256M
          pids: 64
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "/usr/bin/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # Dozzle: Ultralekki podgląd logów kontenerów w czasie rzeczywistym
  # ============================================================================
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    labels:
      dev.dozzle.name: "dozzle • Logi Kontenerów"
      org.opencontainers.image.description: "Przeglądarka logów wszystkich kontenerów Docker w czasie rzeczywistym"
    restart: unless-stopped
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal_network
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOZZLE_NO_ANALYTICS=true
      - DOZZLE_LEVEL=info
      - TZ=${TZ:-Europe/Warsaw}
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
          pids: 128
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # GitHub Exporter: Telemetria zadań GitHub Actions & repozytoriów dla Prometheusa
  # ============================================================================
  github-exporter:
    image: promhippie/github-exporter:latest
    container_name: github-exporter
    labels:
      dev.dozzle.name: "github-exporter • Metryki GitHub"
      org.opencontainers.image.description: "Eksporter statystyk repozytoriów i statusów potoków GitHub Actions do Prometheusa"
    restart: unless-stopped
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal_network
    environment:
      - GITHUB_EXPORTER_TOKEN=${GITHUB_TOKEN}
      - GITHUB_EXPORTER_REQUEST_TIMEOUT=15s
      - GITHUB_EXPORTER_WEB_TIMEOUT=20s
      - GITHUB_EXPORTER_ORGS=TwojaStronaWWW,zeslownikiem
      # Lista monitorowanych repozytoriów (domyślnie projekty platformy + strony klientów B2B)
      - GITHUB_EXPORTER_REPOS=${GITHUB_EXPORTER_REPOS:-TwojaStronaWWW/devops-stack,TwojaStronaWWW/twojastronawww,TwojaStronaWWW/katosalsahub,TwojaStronaWWW/fuegolingua,TwojaStronaWWW/raricart,TwojaStronaWWW/medicusnoster,TwojaStronaWWW/medycyna-regeneracyjna,TwojaStronaWWW/krzysztofpoczatek,TwojaStronaWWW/wspolnekamienice,TwojaStronaWWW/hd-osticket-helpdesk,zeslownikiem/gal-anonym,zeslownikiem/gal-anonim-web}
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
          pids: 64
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD", "/usr/bin/github_exporter", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # AI Router: Scentralizowana bramka AI (PHP 8.3 Alpine, RAG per strona, Zero-Bloat)
  # ============================================================================
  ai-router:
    build:
      context: ../services/ai-router
      dockerfile: Dockerfile
    image: twojastronawww/ai-router:1.0.0
    container_name: ai-router
    labels:
      dev.dozzle.name: "ai-router • Czatbot AI & AMMS"
      org.opencontainers.image.description: "Scentralizowana bramka AI (15-Model Cascade + Asystent AMMS & Oracle FTS5) dla TwojaStronaWWW"
    restart: unless-stopped
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal_network
    ports:
      # Bezpieczeństwo: Powiązanie wyłącznie z pętlą zwrotną (localhost)
      - "127.0.0.1:8085:8080"
    volumes:
      - ../services/ai-router/data:/app/data:ro
      - ai_router_storage:/app/storage
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY:-}
      - CEREBRAS_MODEL=${CEREBRAS_MODEL:-gpt-oss-120b}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - MISTRAL_SQL_MODEL=${MISTRAL_SQL_MODEL:-codestral-latest}
      - CF_AI_API_TOKEN=${CF_AI_API_TOKEN:-}
      - CF_ACCOUNT_ID=${CF_ACCOUNT_ID:-}
      - CF_AI_MODEL=${CF_AI_MODEL:-@cf/meta/llama-3.3-70b-instruct-fp8-fast}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-haiku-4-5}
      - MODEL_DAILY_LIMITS=${MODEL_DAILY_LIMITS:-}
      - AI_CACHE_TTL=${AI_CACHE_TTL:-86400}
      - NTFY_TOPIC=${NTFY_TOPIC:-}
      - NTFY_BASE_URL=${NTFY_BASE_URL:-https://ntfy.sh}
      - NTFY_TOKEN=${NTFY_TOKEN:-}
      - LEAD_WEBHOOK_URL=${LEAD_WEBHOOK_URL:-}
      - OSTICKET_API_KEY=${OSTICKET_API_KEY:-}
      - PHP_CLI_SERVER_WORKERS=4
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://katosalsahub.pl,https://www.katosalsahub.pl,https://fuegolingua.pl,https://www.fuegolingua.pl,https://twojastronawww.pl,https://www.twojastronawww.pl,https://raricart.pl,https://www.raricart.pl,https://medicusnoster.pl,https://www.medicusnoster.pl,https://medycyna-regeneracyjna.pl,https://www.medycyna-regeneracyjna.pl,https://krzysztofpoczatek.pl,https://www.krzysztofpoczatek.pl,https://wspolnekamienice.pl,https://www.wspolnekamienice.pl,https://radar-p1.pages.dev}
      - ANALYTICS_IGNORED_IPS=${ANALYTICS_IGNORED_IPS:-}
      - TZ=${TZ:-Europe/Warsaw}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
          pids: 128
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # Ntfy: Własny, prywatny serwer powiadomień Push (100% RODO / Zero-Trust)
  # ============================================================================
  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    container_name: ntfy
    labels:
      dev.dozzle.name: "ntfy • Prywatny Serwer Push"
      org.opencontainers.image.description: "Własny serwer powiadomień Push RODO/ISO 27001 dla leadów i alertów (ntfy)"
    restart: unless-stopped
    pids_limit: 64
    command:
      - serve
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal_network
    ports:
      - "127.0.0.1:8086:8080"
    volumes:
      - ../config/ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ntfy_data:/var/lib/ntfy
      - ntfy_cache:/var/cache/ntfy
    environment:
      - TZ=${TZ:-Europe/Warsaw}
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
          pids: 64
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # PrivateBin: Jednorazowy Sejf Haseł Zero-Knowledge ("Burn After Reading")
  # ============================================================================
  privatebin:
    image: privatebin/nginx-fpm-alpine:1.7.4
    container_name: privatebin
    labels:
      dev.dozzle.name: "privatebin • Sejf Haseł Zero-Knowledge"
      org.opencontainers.image.description: "Jednorazowy sejf do bezpiecznego przekazywania haseł klientom AES-256-GCM (PrivateBin)"
    restart: unless-stopped
    read_only: true
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal_network
    ports:
      - "127.0.0.1:8087:8080"
    volumes:
      - ../config/privatebin/conf.php:/srv/cfg/conf.php:ro
      - privatebin_data:/srv/data
    environment:
      - TZ=${TZ:-Europe/Warsaw}
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
          pids: 64
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # FreeScout DB: Izolowana relacyjna baza poczty MariaDB 10.11 (InnoDB UTF8MB4)
  # ============================================================================
  freescout-db:
    image: mariadb:10.11
    container_name: freescout-db
    labels:
      dev.dozzle.name: "freescout-db • Baza Poczty MariaDB"
      org.opencontainers.image.description: "Izolowana baza danych MariaDB 10.11 dla centrum poczty FreeScout (brak wystawionych portów)"
    restart: unless-stopped
    pids_limit: 128
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal_network
    volumes:
      - freescout_db_data:/var/lib/mysql
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--innodb-buffer-pool-size=128M"
      - "--max-connections=64"
    environment:
      - MARIADB_ROOT_PASSWORD=${FREESCOUT_DB_ROOT_PASS:-ChangeMe_FreeScoutDbRootPass_2026!}
      - MARIADB_DATABASE=freescout
      - MARIADB_USER=freescout
      - MARIADB_PASSWORD=${FREESCOUT_DB_PASS:-ChangeMe_FreeScoutDbUserPass_2026!}
      - TZ=${TZ:-Europe/Warsaw}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
          pids: 128
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================================
  # FreeScout: Scentralizowane Centrum Poczty & Helpdesk (Zero-Trust + OPSEC)
  # ============================================================================
  freescout:
    image: nfrastack/freescout:2.2.24
    container_name: freescout
    labels:
      dev.dozzle.name: "freescout • Centrum Poczty & Helpdesk"
      org.opencontainers.image.description: "Centralne centrum poczty IMAP/SMTP z izolacją tożsamości skrzynek i OPSEC Lockdown (FreeScout)"
    restart: unless-stopped
    pids_limit: 256
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal_network
    ports:
      # Bezpieczeństwo: Powiązanie wyłącznie z pętlą zwrotną (tunel SSH localhost:8088)
      - "127.0.0.1:8088:80"
    volumes:
      - freescout_data:/data
      - freescout_logs:/logs
    depends_on:
      freescout-db:
        condition: service_healthy
    environment:
      - SETUP_TYPE=AUTO
      - ENABLE_AUTO_UPDATE=FALSE
      - DB_TYPE=mariadb
      - DB_HOST=freescout-db
      - DB_PORT=3306
      - DB_NAME=freescout
      - DB_USER=freescout
      - DB_PASS=${FREESCOUT_DB_PASS:-ChangeMe_FreeScoutDbUserPass_2026!}
      - DB_SSL=FALSE
      - APP_URL=${FREESCOUT_APP_URL:-https://poczta.twojastronawww.pl}
      - ADMIN_EMAIL=${FREESCOUT_ADMIN_EMAIL:-admin@poczta.local}
      - ADMIN_FIRST_NAME=Krzysztof
      - ADMIN_LAST_NAME=Admin
      - ADMIN_PASS=${FREESCOUT_ADMIN_PASS:-ChangeMe_FreeScoutAdminPass_2026!}
      - TIMEZONE=${TZ:-Europe/Warsaw}
      - FREESCOUT_APP_TIMEZONE=${TZ:-Europe/Warsaw}
      - FREESCOUT_APP_LOCALE=pl
      - FREESCOUT_APP_DEBUG=false
      - FREESCOUT_APP_TRUSTED_PROXIES=*
      - PHP_MEMORY_LIMIT=256M
    deploy:
      resources:
        limits:
          cpus: "0.8"
          memory: 512M
          pids: 256
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'X-Forwarded-Proto: https' http://127.0.0.1:80/login >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

# ==============================================================================
# Sieć izolowana
# ==============================================================================
networks:
  internal_network:
    name: devops_internal_network
    driver: bridge

# ==============================================================================
# Trwałe wolumeny danych (Data Persistence)
