name: devops-stack

services:
  # ============================================================================
  # Uptime Kuma: Lekki monitoring blackbox (HTTP/S, Ping, DNS, Port, SSL)
  # ============================================================================
  uptime-kuma:
    image: louislam/uptime-kuma:1.23.13
    container_name: uptime-kuma
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - internal_network
    ports:
      # Bezpieczeństwo: Powiązanie wyłącznie z pętlą zwrotną (localhost)
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    environment:
      - UPTIME_KUMA_PORT=3001
      - TZ=${TZ:-Europe/Warsaw}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "node extra/healthcheck.js || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================================================
  # Prometheus: Zbieranie metryk i silnik TSDB (Zero-Bloat)
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    restart: unless-stopped
    user: "65534:65534" # nobody:nobody (PoLP - non-root)
    security_opt:
      - no-new-privileges:true
    networks:
      - internal_network
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ============================================================================
  # Grafana: Wizualizacja metryk i dashboardy operacyjne
  # ============================================================================
  grafana:
    image: grafana/grafana:10.4.1
    container_name: grafana
    restart: unless-stopped
    user: "472:472" # grafana non-root
    security_opt:
      - no-new-privileges:true
    networks:
      - internal_network
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ../config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-ChangeMeImmediately_2026!}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_LOG_MODE=console
      - GF_LOG_LEVEL=warn
      - TZ=${TZ:-Europe/Warsaw}
    depends_on:
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

# ==============================================================================
# Sieć izolowana
# ==============================================================================
networks:
  internal_network:
    name: devops_internal_network
    driver: bridge

# ==============================================================================
# Trwałe wolumeny danych (Data Persistence)
# ==============================================================================
volumes:
  uptime_kuma_data:
    name: uptime_kuma_data
  prometheus_data:
    name: prometheus_data
  grafana_data:
    name: grafana_data
