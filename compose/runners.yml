name: devops-stack-runners

services:
  # ============================================================================
  # 1. JEDEN ZUNIFIKOWANY RUNNER NA POZIOMIE ORGANIZACJI (OPCJA ZALECANA)
  # Obsługuje automatycznie ZARÓWNO gal-anonym, jak i gal-anonim-web!
  # Token generowany w: https://github.com/organizations/zeslownikiem/settings/actions/runners
  # ============================================================================
  runner-unified:
    image: myoung34/github-runner:ubuntu-jammy
    container_name: runner-zeslownikiem-unified
    restart: unless-stopped
    networks:
      - internal_network
    environment:
      - ORG_NAME=zeslownikiem
      - RUNNER_TOKEN=${RUNNER_ORG_TOKEN}
      - RUNNER_NAME=vps-runner-unified
      - RUNNER_LABELS=self-hosted,linux,arm64,ARM64,vps,unified
      - DOCKER_PRUNE=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          memory: 512M

  # ============================================================================
  # 2. OPCJA ALTERNATYWNA (ROZDZIELONE RUNNERY PER REPOZYTORIUM - profil 'split')
  # Użyj tylko jeśli nie posiadasz uprawnień administratora organizacji:
  # docker compose --profile split up -d
  # ============================================================================
  runner-desktop:
    image: myoung34/github-runner:ubuntu-jammy
    container_name: runner-gal-anonym
    profiles: ["split"]
    restart: unless-stopped
    networks:
      - internal_network
    environment:
      - REPO_URL=https://github.com/zeslownikiem/gal-anonym
      - RUNNER_TOKEN=${RUNNER_DESKTOP_TOKEN}
      - RUNNER_NAME=vps-runner-desktop
      - RUNNER_LABELS=self-hosted,linux,arm64,ARM64,vps
      - DOCKER_PRUNE=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          memory: 512M

  runner-web:
    image: myoung34/github-runner:ubuntu-jammy
    container_name: runner-gal-anonim-web
    profiles: ["split"]
    restart: unless-stopped
    networks:
      - internal_network
    environment:
      - REPO_URL=https://github.com/zeslownikiem/gal-anonim-web
      - RUNNER_TOKEN=${RUNNER_WEB_TOKEN}
      - RUNNER_NAME=vps-runner-web
      - RUNNER_LABELS=self-hosted,linux,arm64,ARM64,vps
      - DOCKER_PRUNE=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          memory: 512M

networks:
  internal_network:
    external: true
    name: devops_internal_network
