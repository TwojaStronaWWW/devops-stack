name: devops-stack

services:
  # ============================================================================
  # 1. JEDEN ZUNIFIKOWANY RUNNER NA POZIOMIE ORGANIZACJI (OPCJA ZALECANA)
  # Obsługuje automatycznie ZARÓWNO gal-anonym, jak i gal-anonim-web!
  # Token generowany w: https://github.com/organizations/zeslownikiem/settings/actions/runners
  # ============================================================================
  runner-unified:
    image: myoung34/github-runner:ubuntu-jammy
    container_name: runner-zeslownikiem-unified
    labels:
      dev.dozzle.name: "runner-zeslownikiem • CI/CD ZeSłownikiem"
      org.opencontainers.image.description: "Self-Hosted GitHub Actions Runner ARM64 dla organizacji zeslownikiem"
    restart: unless-stopped
    networks:
      - internal_network
    environment:
      - RUNNER_SCOPE=${RUNNER_ZESLOWNIKIEM_SCOPE:-repo}
      - ORG_NAME=zeslownikiem
      - REPO_URL=https://github.com/zeslownikiem/gal-anonym
      - ACCESS_TOKEN=${GITHUB_TOKEN}
      - RUNNER_NAME=vps-runner-unified
      - RANDOM_RUNNER_SUFFIX=false
      - RUNNER_LABELS=self-hosted,linux,arm64,ARM64,vps,unified
      - CONFIGURED_ACTIONS_RUNNER_FILES_DIR=/runner-data
      - DISABLE_AUTOMATIC_DEREGISTRATION=true
      - DOCKER_PRUNE=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner_zeslownikiem_data:/runner-data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          memory: 512M

  # ============================================================================
  # 2. ZUNIFIKOWANY RUNNER DLA ORGANIZACJI TwojaStronaWWW
  # Obsługuje automatycznie repozytoria TwojaStronaWWW!
  # ============================================================================
  runner-twojastronawww:
    image: myoung34/github-runner:ubuntu-jammy
    container_name: runner-twojastronawww-unified
    labels:
      dev.dozzle.name: "runner-twojastronawww • CI/CD TwojaStronaWWW"
      org.opencontainers.image.description: "Self-Hosted GitHub Actions Runner ARM64 dla organizacji TwojaStronaWWW"
    restart: unless-stopped
    networks:
      - internal_network
    environment:
      - RUNNER_SCOPE=${RUNNER_TWOJASTRONAWWW_SCOPE:-repo}
      - ORG_NAME=TwojaStronaWWW
      - REPO_URL=https://github.com/TwojaStronaWWW/devops-stack
      - ACCESS_TOKEN=${GITHUB_TOKEN}
      - RUNNER_NAME=vps-runner-twojastronawww-unified
      - RANDOM_RUNNER_SUFFIX=false
      - RUNNER_LABELS=self-hosted,linux,arm64,ARM64,vps,unified,twojastronawww
      - CONFIGURED_ACTIONS_RUNNER_FILES_DIR=/runner-data
      - DISABLE_AUTOMATIC_DEREGISTRATION=true
      - DOCKER_PRUNE=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner_twojastronawww_data:/runner-data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          memory: 512M


  # ============================================================================
  # 2. OPCJA ALTERNATYWNA (ROZDZIELONE RUNNERY PER REPOZYTORIUM - profil 'split')
  # Użyj tylko jeśli nie posiadasz uprawnień administratora organizacji:
  # docker compose --profile split up -d
  # ============================================================================
  runner-desktop:
    image: myoung34/github-runner:ubuntu-jammy
    container_name: runner-gal-anonym
    profiles: ["split"]
    restart: unless-stopped
    networks:
      - internal_network
    environment:
      - REPO_URL=https://github.com/zeslownikiem/gal-anonym
      - RUNNER_TOKEN=${RUNNER_DESKTOP_TOKEN}
      - RUNNER_NAME=vps-runner-desktop
      - RUNNER_LABELS=self-hosted,linux,arm64,ARM64,vps
      - DOCKER_PRUNE=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          memory: 512M

  runner-web:
    image: myoung34/github-runner:ubuntu-jammy
    container_name: runner-gal-anonim-web
    profiles: ["split"]
    restart: unless-stopped
    networks:
      - internal_network
    environment:
      - REPO_URL=https://github.com/zeslownikiem/gal-anonim-web
      - RUNNER_TOKEN=${RUNNER_WEB_TOKEN}
      - RUNNER_NAME=vps-runner-web
      - RUNNER_LABELS=self-hosted,linux,arm64,ARM64,vps
      - DOCKER_PRUNE=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          memory: 512M

networks:
  internal_network:
    external: true
    name: devops_internal_network

volumes:
  runner_zeslownikiem_data:
    name: runner_zeslownikiem_data
  runner_twojastronawww_data:
    name: runner_twojastronawww_data

