name: devops-stack

services:
  # ============================================================================
  # Cloudflare Tunnel: Bezpieczny tunel Zero Trust (brak otwartych portów na VPS)
  # ============================================================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    labels:
      dev.dozzle.name: "cloudflared • Tunel Zero Trust"
      org.opencontainers.image.description: "Szyfrowany tunel krawędziowy Cloudflare Zero Trust (dostęp bez otwartych portów WAN)"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - internal_network
    command: tunnel --metrics 0.0.0.0:2000 --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M

  # ============================================================================
  # GitHub Actions Self-Hosted Runner (opcjonalny, izolowany runner wdrożeniowy)
  # ============================================================================
  # github-runner:
  #   image: myoung34/github-runner:latest
  #   container_name: github-runner
  #   restart: unless-stopped
  #   networks:
  #     - internal_network
  #   environment:
  #     - REPO_URL=${GITHUB_REPO_URL}
  #     - RUNNER_TOKEN=${GITHUB_RUNNER_TOKEN}
  #     - RUNNER_NAME=vps-oracle-runner
  #     - RUNNER_LABELS=vps,arm64
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: "2.0"
  #         memory: 2048M

networks:
  internal_network:
    external: true
    name: devops_internal_network
