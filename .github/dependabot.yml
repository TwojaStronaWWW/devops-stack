version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/compose"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/services/ai-router"
    schedule:
      interval: "weekly"
