name: Dependabot & Jules Auto-Merge
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: ["CI & Quality Gate"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    name: 1. Dependabot Patch/Minor Auto-Approve
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Auto-approve & Enable Auto-Merge for Patch/Minor updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL" || true
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  jules-approve:
    name: 2. Google Jules PR Safety Check & Auto-Approve
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      (github.actor == 'google-labs-jules[bot]' || github.event.pull_request.user.login == 'google-labs-jules[bot]')
    steps:
      - name: Weryfikacja ochrony plików krytycznych (Zero-Trust Guard)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHANGED_FILES=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json files --jq '.files[].path')
          echo "Zmienione pliki w PR #${PR_NUMBER}:"
          echo "$CHANGED_FILES"
          if echo "$CHANGED_FILES" | grep -E '^(\.env|\.gitleaks\.toml|scripts/01-harden-os\.sh|\.github/workflows/(deploy|ai-security-review|dependabot-automerge))'; then
            echo "::warning::PR od Google Jules modyfikuje chronione pliki CI/CD lub konfigurację sekretów — wymagana ręczna akceptacja właściciela."
            exit 0
          fi
          gh pr review "$PR_NUMBER" --repo "${{ github.repository }}" --approve --body "✅ **Automatyczna akceptacja (Zero-Touch Autopilot):** PR od Google Jules nie narusza chronionych plików wdrożeniowych. Oczekiwanie na zielony wynik *CI & Quality Gate* przed automatycznym scaleniem."
          gh pr merge "$PR_NUMBER" --repo "${{ github.repository }}" --auto --squash --delete-branch || true

  automerge-on-ci-success:
    name: 3. Auto-Merge Verified Bot PR after CI & Quality Gate Success
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Scalenie zwalidowanego PR od Google Jules lub Dependabot po sukcesie CI
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_JSON=$(gh pr list --repo "${{ github.repository }}" --state open --json number,author,isDraft,headRefOid,files --jq ".[] | select(.headRefOid == \"$HEAD_SHA\")")
          if [ -z "$PR_JSON" ]; then
            echo "Brak otwartego PR dla commita ${HEAD_SHA}."
            exit 0
          fi
          PR_NUMBER=$(echo "$PR_JSON" | jq -r '.number')
          PR_AUTHOR=$(echo "$PR_JSON" | jq -r '.author.login')
          IS_DRAFT=$(echo "$PR_JSON" | jq -r '.isDraft')

          if [ "$IS_DRAFT" = "true" ]; then
            echo "PR #${PR_NUMBER} jest jeszcze szkicem (Draft) — pomijam."
            exit 0
          fi

          if [ "$PR_AUTHOR" != "google-labs-jules[bot]" ] && [ "$PR_AUTHOR" != "app/google-labs-jules" ] && [ "$PR_AUTHOR" != "dependabot[bot]" ] && [ "$PR_AUTHOR" != "app/dependabot" ]; then
            echo "Autor PR #${PR_NUMBER} (${PR_AUTHOR}) nie należy do listy automatycznych botów — pomijam."
            exit 0
          fi

          CHANGED_FILES=$(echo "$PR_JSON" | jq -r '.files[].path')
          if echo "$CHANGED_FILES" | grep -E '^(\.env|\.gitleaks\.toml|scripts/01-harden-os\.sh|\.github/workflows/(deploy|ai-security-review|dependabot-automerge))'; then
            echo "::warning::PR #${PR_NUMBER} dotyka chronionych plików CI/CD — pomijam automatyczne scalenie."
            exit 0
          fi

          echo "✅ CI & Quality Gate zakończone sukcesem dla PR #${PR_NUMBER} (${PR_AUTHOR}). Wykonywanie automatycznego Squash & Merge..."
          gh pr merge "$PR_NUMBER" --repo "${{ github.repository }}" --squash --delete-branch || gh pr merge "$PR_NUMBER" --repo "${{ github.repository }}" --auto --squash --delete-branch || true
