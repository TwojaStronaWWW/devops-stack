name: Deploy Stack to VPS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  ci:
    name: Run Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Full Quality Gate
        run: npm run check

  deploy:
    name: Deploy Stack to Target Host
    needs: ci
    runs-on: ubuntu-latest
    if: needs.ci.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Deploy via SSH Key (Ed25519)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            DEPLOY_PATH="/opt/devops-stack"
            echo "==> Wdrazanie aktualizacji w ${DEPLOY_PATH}..."

            if [ ! -d "${DEPLOY_PATH}" ]; then
              echo "BLAD: Katalog ${DEPLOY_PATH} nie istnieje na serwerze docelowym."
              exit 1
            fi

            cd "${DEPLOY_PATH}"
            git fetch origin main
            git reset --hard origin/main

            cd compose
            docker compose up -d --build --remove-orphans

            echo "==> Wdrozenie zakonczone pomyslnie."