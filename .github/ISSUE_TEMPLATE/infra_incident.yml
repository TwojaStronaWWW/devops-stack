name: 🚨 Zgłoszenie awarii infrastruktury (Incydent)
description: Zgłoś błąd, awarię kontenera lub problem z dostępnością usług VPS
title: "fix(infra): [Krótki opis awarii]"
labels: ["bug", "incident", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Dziękujemy za zgłoszenie incydentu w infrastrukturze TwojaStronaWWW DevOps Stack.
  - type: dropdown
    id: component
    attributes:
      label: Komponent dotknięty awarią
      options:
        - AI Router (Multi-Provider RAG Proxy, Cache <5ms, Lead Extractor Ntfy)
        - Cloudflare Zero Trust Tunnel (cloudflared:2000)
        - GitHub Actions Runners (devops_runners_network: zeslownikiem / twojastronawww / gal-anonim-web)
        - Kopie zapasowe i Disaster Recovery (backup-offsite.sh / backup-websites-lh.sh / restore-backup.sh)
        - Strażnik i Harmonogramy Systemd (devops-audit.timer / devops-backup.timer)
        - Monitoring Uptime Kuma & Powiadomienia Push Ntfy.sh
        - Prometheus / Grafana / Reguły Alertów (ai-router.yml)
        - cAdvisor / Node Exporter / Dozzle / GitHub Exporter
        - Oracle Cloud Compute (ARM64 Always Free) / System operacyjny Ubuntu
        - Sieć Docker / Skrypty pomocnicze
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Opis incydentu i symptomy
      description: Co dokładnie nie działa? Jakie błędy zwraca usługa lub przeglądarka?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Wynik audytu i logi z kontenera lub serwera
      description: Wklej wynik `npm run audit` (`scripts/audit-server.sh`), `./scripts/ai-router-report.ps1` lub logi z `docker compose logs <usługa>` / `journalctl`
      render: shell
