name: 🛠️ Zadanie techniczne / Rozwój infrastruktury
description: Zgłoś potrzebę dodania nowej usługi, optymalizacji lub aktualizacji stacku
title: "feat(infra): [Krótki opis zadania]"
labels: ["enhancement", "infrastructure"]
body:
  - type: markdown
    attributes:
      value: |
        Zgłoś planowane ulepszenie lub nowe wymaganie infrastrukturalne.
  - type: textarea
    id: scope
    attributes:
      label: Cel i zakres zadania
      description: Co ma zostać wdrożone lub zmienione w infrastrukturze VPS?
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Kryteria sukcesu (Definition of Done)
      description: Jak zweryfikujemy, że usługa działa poprawnie i bezpiecznie?
      value: |
        - [ ] Konfiguracja w compose przetestowana lokalnie (`npm run check` — 38/38 testów) i na VPS (`npm run audit` — 55 OK / 0 WARN / 0 FAIL)
        - [ ] Brak przekroczenia limitów Oracle Always Free (0.00 PLN / 4 OCPU / 24 GB RAM / 200 GB Storage)
        - [ ] Routing zabezpieczony tunelem Cloudflare Zero Trust (`127.0.0.1` + dwustrefowa izolacja sieciowa)
        - [ ] Nowe sekrety zarejestrowane w KeePass (`Databasekpoczatek.kdbx`) przed wdrożeniem do `.env`
        - [ ] Brak osieroconych zasobów (Automated Garbage Collection: `docker image prune -f` / `builder prune`)
        - [ ] Zgodność z ISO 27001, `_site-template` (Cross-Template Contract) i zaktualizowana dokumentacja (`AGENTS.md`, `GEMINI.md`, `README.md`)
    validations:
      required: true
