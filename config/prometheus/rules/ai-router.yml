groups:
  - name: ai-router
    interval: 30s
    rules:
      - alert: AIRouterDown
        expr: up{job="ai-router"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "AI Router nie odpowiada na scrape"
          description: "Kontener ai-router jest niedostepny od 2 minut - czatboty na stronach nie dzialaja."

      - alert: AIRouterAllModelsFailed
        expr: increase(ai_router_requests_total{outcome="all_models_failed"}[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Zaden model AI nie odpowiedzial (HTTP 502)"
          description: "W ostatnich 10 minutach {{ $value }} zapytan zakonczylo sie bledem wszystkich modeli kaskady."

      - alert: AIRouterPrimaryModelSuspended
        expr: ai_router_model_suspended * on(model) group_left() (ai_router_model_info{position="0"}) == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Model glowny {{ $labels.model }} zawieszony (cooldown)"
          description: "Router przelacza ruch na modele zapasowe - sprawdz limity Free Tier (429)."

      - alert: AIRouterFallbackInUse
        expr: sum(increase(ai_router_answers_by_depth_total{depth!="0"}[15m])) > 0
        labels:
          severity: info
        annotations:
          summary: "Router odpowiada modelami zapasowymi"
          description: "{{ $value }} odpowiedzi w ostatnich 15 min pochodzilo z modelu innego niz pierwszy w kaskadzie."

      - alert: AIRouterModelQuotaNearLimit
        expr: ai_router_model_requests_today / ai_router_model_daily_limit > 0.8
        labels:
          severity: warning
        annotations:
          summary: "Model {{ $labels.model }} zuzyl >80% dziennego limitu"
          description: "Zuzycie dzienne (doba Pacyficzna): {{ $value | humanizePercentage }}."

      - alert: AIRouterNoFallbackProvider
        expr: sum(ai_router_provider_configured{provider=~"groq|cerebras|cloudflare|openrouter|anthropic"}) == 0
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "Brak skonfigurowanego zapasowego providera (Groq/Cerebras/Cloudflare/OpenRouter/Anthropic)"
          description: "Kaskada opiera sie wylacznie na modelach Gemini - jedna awaria konta/klucza wylacza czatboty."

      - alert: AIRouterRateLimitSpike
        expr: increase(ai_router_requests_total{outcome="rate_limited"}[10m]) > 20
        labels:
          severity: warning
        annotations:
          summary: "Duzo blokad rate-limit (429) na AI Routerze"
          description: "{{ $value }} zablokowanych zapytan w 10 min - mozliwy abuse lub zbyt niski limit per IP."

      - alert: AIRouterModelDeprecated
        expr: increase(ai_router_model_attempts_total{result="not_found"}[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Model AI {{ $labels.model }} zwraca HTTP 404 (wycofany przez dostawce)"
          description: "Dostawca wycofal lub zmienil identyfikator modelu {{ $labels.model }} (not_found). Zaktualizuj kaskade w chat-router.php."

      - alert: AIRouterSecurityAttackDetected
        expr: sum(increase(ai_router_requests_total{outcome=~"security_blocked|cors_forbidden|bad_request"}[10m])) > 10
        labels:
          severity: warning
        annotations:
          summary: "Wykryto zmasowany atak / skanowanie na AI Router (WAF / Prompt Injection / CORS)"
          description: "W ostatnich 10 minutach filtr bezpieczenstwa AI Routera zablokowal {{ $value | printf \"%.0f\" }} zlosliwych zadan."

  - name: devops-infrastructure
    interval: 30s
    rules:
      - alert: WebsiteOrServiceDown
        expr: monitor_status == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Serwis lub strona WWW {{ $labels.monitor_name }} nie odpowiada (DOWN)"
          description: "Monitor Uptime Kuma dla {{ $labels.monitor_name }} ({{ $labels.monitor_url }}) zwraca status DOWN od ponad 3 minut."

      - alert: SSLCertificateExpiringSoon
        expr: monitor_cert_days_remaining > 0 and monitor_cert_days_remaining < 14
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Certyfikat SSL dla {{ $labels.monitor_name }} wygasa za mniej niz 14 dni"
          description: "Pozostalo {{ $value }} dni waznosci certyfikatu TLS dla {{ $labels.monitor_name }}."

      - alert: VPSHostDiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Malo wolnego miejsca na dysku systemowym VPS (< 20%)"
          description: "Na partycji glownej / pozostalo zaledwie {{ $value | printf \"%.1f\" }}% wolnego miejsca."

      - alert: VPSHostMemoryLow
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Wysokie zuzycie pamieci RAM na hoscie VPS (< 15% wolnego)"
          description: "Dostepna pamiec RAM spadla do {{ $value | printf \"%.1f\" }}% calkowitej puli 24 GB."

      - alert: VPSBackupFailedOrStale
        expr: devops_backup_status == 0 or devops_backup_verified == 0 or devops_backup_sqlite_verified == 0 or (time() - devops_backup_last_timestamp_seconds) > 93600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Backup wolumenow VPS nie powiodl sie, ma blad integralnosci lub jest przestarzaly (>26h)"
          description: "Sprawdz status devops-backup.service oraz plik backup.prom na serwerze VPS."

      - alert: WebsitesBackupFailedOrStale
        expr: devops_backup_websites_status == 0 or devops_backup_websites_verified == 0 or devops_backup_websites_db_verified == 0 or (time() - devops_backup_websites_last_timestamp_seconds) > 93600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Backup stron WWW lub bazy MySQL (LH.pl) nie powiodl sie lub jest przestarzaly (>26h)"
          description: "Sprawdz logi backup-websites-lh.sh (journalctl -u devops-backup.service) oraz plik backup_websites.prom."

      - alert: CloudflareTunnelDown
        expr: up{job="cloudflared"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Tunel krawedziowy Cloudflare Zero Trust (cloudflared) nie odpowiada"
          description: "Kontener cloudflared nie eksportuje telemetrii na porcie 2000 od ponad 2 minut - ruch z WAN do ai.twojastronawww.pl moze byc przerwany."

      - alert: SSHBruteForceWaveDetected
        expr: devops_fail2ban_banned_current >= 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Aktywna fala ataku Brute-Force na SSH (Fail2Ban zbanowal >= 5 IP jednoczesnie)"
          description: "Demon IPS Fail2Ban utrzymuje obecnie {{ $value }} jednoczesnych blokad IP na porcie 22 SSH."

      - alert: WebsiteCoreWebVitalsLcpSlow
        expr: (web_analytics_cwv_lcp_seconds_sum / clamp_min(web_analytics_cwv_lcp_seconds_count, 1)) > 2.5 and web_analytics_cwv_lcp_seconds_count >= 5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Pogorszenie szybkosci ladowania strony {{ $labels.site }} (Core Web Vitals LCP > 2.5s)"
          description: "Sredni czas renderowania najwiekszego elementu (LCP) u uzytkownikow serwisu {{ $labels.site }} wynosi {{ $value | printf \"%.2f\" }}s (prog Google Good <= 2.5s)."
