# Global settings
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alertmanager configuration (optional / future)
alerting:
  alertmanagers: []

# Rule files (optional / future)
rule_files:
  - /etc/prometheus/rules/*.yml

# Scrape targets
scrape_configs:
  # 1. Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Uptime Kuma metrics endpoint
  - job_name: 'uptime-kuma'
    metrics_path: '/metrics'
    basic_auth:
      username: 'kpoczatek'
      password_file: '/etc/prometheus/kuma_password'
    static_configs:
      - targets: ['uptime-kuma:3001']

  # 3. Node Exporter (metryki sprzętowe i systemowe hosta - odświeżanie 5s)
  - job_name: 'node-exporter'
    scrape_interval: 5s
    scrape_timeout: 4s
    static_configs:
      - targets: ['node-exporter:9100']

  # 4. cAdvisor (metryki zasobów kontenerów Dockera - odświeżanie 5s)
  - job_name: 'cadvisor'
    scrape_interval: 5s
    scrape_timeout: 4s
    static_configs:
      - targets: ['cadvisor:8080']

  # 5. GitHub Exporter (telemetria repozytoriów i workflow CI/CD)
  - job_name: 'github-exporter'
    static_configs:
      - targets: ['github-exporter:9504']

  # 6. AI Router (metryki Prometheus / availability probe)
  - job_name: 'ai-router'
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 5s
    static_configs:
      - targets: ['ai-router:8080']
        labels:
          service: 'ai-router'
          component: 'gemini-proxy'
